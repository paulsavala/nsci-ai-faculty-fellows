<html lang="en">
<head>
<meta charset="utf-8">

<title>Getting Things Done with Claude Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* task-page extras (move into workshop.css once settled) */
  .topic-label { padding: 18px 24px 6px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #64748B; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 28px; }
  .chip { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--card); color: var(--ink); }
  .chip.files { background: var(--blue-soft); }
  .chip.browser { background: #DCFCE7; color: #166534; }
  .chip.artifact { background: #FEF3C7; color: #92400E; }
  .callout { background: var(--amber-bg); color: var(--amber-ink); border-radius: 12px; padding: 16px 20px; font-size: 15px; line-height: 1.55; margin: 0 0 8px; }
  .callout b { color: var(--amber-ink); }
  ul.plain { margin: 0; padding-left: 20px; line-height: 1.7; font-size: 16px; }
  .step { background: white; border: 1px solid var(--rule); border-radius: 14px; padding: 22px 26px; margin: 0 0 16px; }
  .step h4 { margin: 0 0 6px; font-size: 18px; color: var(--ink); display: flex; gap: 12px; align-items: baseline; }
  .step h4 .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: white; display: grid; place-items: center; font-size: 14px; }
  .step p { margin: 0 0 4px; font-size: 15px; line-height: 1.55; }
  .prompt-wrap { position: relative; }
  .prompt-wrap .prompt { padding-right: 76px; }
  .copy { position: absolute; top: 8px; right: 8px; font: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--rule); background: white; color: var(--ink); cursor: pointer; }
  .copy:hover { border-color: var(--blue); color: var(--blue); }
  .look { font-size: 14px; color: var(--body); margin-top: 8px; }
  .look b { color: var(--ink); }
  .tips { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .tip { background: var(--card); border-radius: 12px; padding: 16px 18px; font-size: 15px; line-height: 1.5; }
  .tip b { display: block; color: var(--ink); margin-bottom: 4px; }
  details.extra { background: white; border: 1px solid var(--rule); border-radius: 12px; padding: 14px 20px; margin: 0 0 12px; }
  details.extra summary { cursor: pointer; font-weight: 500; color: var(--ink); }
  details.extra p { font-size: 15px; margin: 10px 0 0; }
  .guide-block { margin: 0 0 36px; }
  .guide-block p { font-size: 16px; line-height: 1.6; margin: 0 0 14px; max-width: 760px; }
  .guide-block img { display: block; max-width: 100%; max-height: 520px; border-radius: 12px; border: 1px solid var(--rule); box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12); }
  /* interactive app mock */
  .mk-hint { font-size: 15px; color: var(--body); margin: 0 0 12px; }
  .mk-scroll { overflow-x: auto; border-radius: 14px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18); }
  .mk-app { display: flex; min-width: 760px; height: 470px; background: #1a1a19; color: #e8e6e1; font-size: 14px; border-radius: 14px; overflow: hidden; }
  .mk-side { width: 210px; flex: none; background: #232322; border-right: 1px solid #333; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  .mk-top { display: flex; align-items: center; gap: 8px; padding: 0 6px 12px; }
  .mk-dots i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; background: #ff5f57; }
  .mk-dots i:nth-child(2) { background: #febc2e; } .mk-dots i:nth-child(3) { background: #28c840; }
  .mk-seg { display: flex; gap: 2px; margin-left: auto; }
  .mk-ico { padding: 3px 6px; border-radius: 6px; font-size: 13px; color: #c9c7c1; }
  .mk-ico.mk-on { background: #3a3a38; }
  .mk-dim { color: #777; }
  .mk-item { padding: 8px 10px; border-radius: 8px; color: #e8e6e1; display: flex; align-items: center; gap: 6px; }
  .mk-new { background: #3a3a38; }
  .mk-plus { margin-left: auto; color: #aaa; }
  .mk-group { padding: 18px 10px 0; color: #9a978f; font-size: 13px; line-height: 1.1; border-radius: 8px; }
  .mk-acct { margin-top: auto; padding: 10px; border-top: 1px solid #333; display: flex; align-items: center; gap: 8px; border-radius: 8px; }
  .mk-av { width: 22px; height: 22px; border-radius: 50%; background: #2e9e4f; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: white; }
  .mk-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px; gap: 12px; }
  .mk-hello { font-family: Georgia, serif; font-size: 30px; color: #f2f0eb; margin-bottom: 6px; }
  .mk-star { color: #d97757; }
  .mk-box { width: 100%; max-width: 520px; background: #2f2f2d; border: 1px solid #444; border-radius: 14px; padding: 12px 14px 8px; }
  .mk-input { color: #8f8c85; padding: 2px 4px 22px; border-radius: 6px; }
  .mk-row, .mk-ctrl { display: flex; align-items: center; gap: 6px; }
  .mk-ctrl { width: 100%; max-width: 520px; padding: 0 4px; }
  .mk-sp { flex: 1; }
  .mk-pill { padding: 4px 8px; border-radius: 8px; font-size: 13px; color: #e8e6e1; }
  .mk-pill.mk-dimtxt { color: #9a978f; }
  .mk-recent { width: 100%; max-width: 520px; margin-top: 18px; padding: 6px; border-radius: 10px; }
  .mk-rhead { display: flex; justify-content: space-between; color: #9a978f; font-size: 13px; margin-bottom: 8px; }
  .mk-cards { display: flex; gap: 10px; }
  .mk-cards div { flex: 1; border: 1px solid #3a3a38; border-radius: 10px; overflow: hidden; font-size: 12px; color: #d6d3cc; padding-bottom: 6px; }
  .mk-cards i { display: block; height: 46px; margin-bottom: 6px; background: linear-gradient(135deg, #1e3a6e, #0f172a); }
  .mk-cards div:nth-child(2) i { background: linear-gradient(135deg, #e5e7eb, #93c5fd); }
  .mk-cards div:nth-child(3) i { background: linear-gradient(135deg, #f1f5f9, #cbd5e1); }
  .mk-cards div { text-indent: 8px; }
  [data-tip] { cursor: help; transition: box-shadow 0.12s, background 0.12s; }
  [data-tip]:hover, [data-tip]:focus, [data-tip].mk-active { outline: none; box-shadow: 0 0 0 2px #3B82F6; background-color: rgba(59, 130, 246, 0.14); }
  .mk-tip { position: absolute; z-index: 20; max-width: 280px; padding: 10px 14px; border-radius: 10px; background: white; color: var(--ink); font-size: 14px; line-height: 1.45; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25); pointer-events: none; opacity: 0; transition: opacity 0.12s; }
  .mk-tip.show { opacity: 1; }
  /* policy quiz */
  .sec-btn.locked { opacity: 0.45; cursor: not-allowed; }
  .sec-btn.locked:hover { background: none; }
  .quiz-q { border: 1px solid var(--rule); border-radius: 14px; background: white; padding: 18px 24px 14px; margin: 0 0 14px; }
  .quiz-q legend { display: flex; gap: 12px; align-items: baseline; font-size: 16px; font-weight: 500; color: var(--ink); line-height: 1.45; padding: 0; float: left; width: 100%; margin-bottom: 10px; }
  .quiz-q legend .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: white; display: grid; place-items: center; font-size: 13px; }
  .quiz-opt { display: flex; gap: 10px; align-items: flex-start; clear: both; padding: 7px 10px 7px 38px; border-radius: 8px; font-size: 15px; line-height: 1.45; cursor: pointer; }
  .quiz-opt:hover { background: var(--card); }
  .quiz-opt input { margin-top: 4px; }
  .quiz-q.right { border-color: var(--green); }
  .quiz-q.wrong { border-color: var(--red); }
  .quiz-why { margin: 8px 0 0 38px; font-size: 14px; }
  .quiz-q.right .quiz-why { color: var(--green); }
  .quiz-q.wrong .quiz-why { color: var(--red); }
  .quiz-pass { background: #DCFCE7; color: #166534; font-weight: 700; border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; }
  .vid-tag { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #1E3A8A; color: #BFDBFE; font-size: 10px; letter-spacing: 0.5px; }
  .vid-dot { color: #93C5FD; font-size: 11px; }
  /* sharing page */
  .share-who { display: flex; gap: 16px; flex-wrap: wrap; }
  .share-who label { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; font-weight: 500; color: var(--ink); font-size: 15px; }
  .share-who input, .share-who select { padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; font: inherit; font-size: 15px; background: var(--bg); color: var(--ink); }
  .q label small { font-weight: 400; color: var(--muted); }
  .share-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 16px; }
  .share-checks label { display: flex; gap: 8px; align-items: baseline; font-weight: 400; font-size: 15px; margin: 0; cursor: pointer; }
  .share-private { display: flex; gap: 10px; align-items: baseline; margin-top: 22px; padding: 12px 14px; border-radius: 10px; background: var(--card); font-size: 15px; cursor: pointer; }
  .share-list .others-dept { background: white; border: 1px solid var(--rule); border-radius: 12px; padding: 0 18px 8px; margin-bottom: 12px; }
  .share-card { border-top: 1px solid var(--rule); padding: 12px 0; }
  .share-card p { margin: 6px 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .share-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .share-tags .chip { font-size: 12px; padding: 3px 10px; }
  .share-how { font-weight: 700; color: var(--ink); }
  .share-tip { background: var(--card); border-radius: 8px; padding: 8px 12px; }
  .share-nudge { margin-top: 40px; padding: 16px 20px; border-radius: 12px; background: var(--blue-soft); color: var(--ink); font-size: 15px; }
  .share-nudge a { font-weight: 700; }
</style>
</head>

<script>
/* =====================================================================
   THIS TRAINING'S CONTENT. Topics hold tasks (step-by-step prompts) or
   guide pages (guide: true, with blocks of text and screenshots).

  "title": "Getting Things Done with Claude Desktop",
  "subtitle": "NSCI Faculty Workshop",

    {

        {

            [

            ],
            [
              "Be careful with extensions and add-ons",
              "AI browser extensions need broad permissions, so use extreme caution. Unapproved AI add-ons for Canvas, Google Workspace, Box or Zoom are prohibited. Never give an AI tool your password."

            [
              "Meetings",
              "No third-party recorder bots (Otter, Fireflies, Read.ai) in non-public meetings. If you use an approved tool to record or transcribe, tell everyone at the start."

            [
              "You're responsible for the output",
              "Check everything an AI produces before you use, post or send it. Disclose significant AI use, and don't generate university logos, branding or Topper without Marketing's approval."

            [
              "Your courses, your rules",
              "Faculty decide what AI use is acceptable in their courses and must state it clearly in the syllabus."

          "note": "Claude isn't on the university's approved list, so this training treats it as an unsupported tool: every task uses only your own, non-sensitive materials. If you're unsure whether something is sensitive, leave it out or ask IET at <a href=\"mailto:support@stedwards.edu\">support@stedwards.edu</a>.",
          "quiz": [
            {
              "q": "You have a spreadsheet of exam scores with student names and ID numbers, and you'd like an AI tool to make a histogram of the scores. What should you do?",

                "Upload it as is, as long as the tool is a paid version",
                "Upload it only to Gemini, since Gemini is approved",
                "Remove the names and ID numbers first, or use made-up scores with a similar spread",
                "Email it to IET and ask them to run it"

                "Never share it: giving a password to an AI tool violates university policy",

<script>
(function () {
  const SITE = window.SITE_CONFIG || {};
  const T = window.TASKS;
  const STORE_KEY = "nsciTrainings.claude-desktop-tasks";
  const all = [];
  T.topics.forEach(tp => tp.tasks.forEach(t => all.push(Object.assign({ topic: tp.name }, t))));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* saved state (this browser only), same pattern as the other trainings */
  let state = {};
  try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { /* storage unavailable */ }
  state.done = state.done || [];
  const fromHash = all.findIndex(t => t.id === location.hash.slice(1));
  let current = fromHash >= 0 ? fromHash : Math.min(state.current || 0, all.length - 1);
  // The policy quiz gates everything after it.
  const GATE = all.findIndex(t => t.policy);
  const locked = i => GATE >= 0 && !state.policyPassed && i > GATE;
  if (locked(current)) current = GATE;
  function save() {
    state.current = current;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* fine */ }
  }

  document.title = T.title;
  document.body.classList.add("training");
  document.body.innerHTML = `
    <aside class="sidebar">
      <div class="brand">
        <a class="home" href="../">← All trainings</a>
        <div class="bar"></div>
        <h1>${T.title}</h1>
        <p>${T.subtitle || ""}${SITE.presenter ? ` · ${SITE.presenter}` : ""}</p>
      </div>
      <nav id="nav"></nav>
    </aside>
    <main id="main"></main>`;

  function renderNav() {
    let html = "", i = 0;
    T.topics.forEach(tp => {
      html += `<div class="topic-label">${tp.name}${tp.tasks.some(t => t.youtubeId) ? ` <span class="vid-tag">▶ video</span>` : ""}</div>`;
      tp.tasks.forEach(t => {
        const idx = i++, done = state.done.includes(t.id), lock = locked(idx);
        html += `<button class="sec-btn ${idx === current ? "active" : ""} ${done ? "done" : ""} ${lock ? "locked" : ""}" data-go="${idx}" ${lock ? "disabled" : ""}>
          <span class="num">${done ? "✓" : lock ? "🔒" : idx + 1}</span>
          <span>${t.title}${t.youtubeId ? ` <span class="vid-dot" title="Has a video">▶</span>` : ""}<span class="meta">${lock ? "pass the policy quiz first" : t.time || ""}</span></span></button>`;
      });
    });
    document.getElementById("nav").innerHTML = html;
  }

  const CHIPS = { browser: `<span class="chip browser">Browser</span>`, files: `<span class="chip files">Your files</span>`, artifact: `<span class="chip artifact">Artifact</span>` };
  const promptBox = p => `<div class="prompt-wrap"><span class="prompt">${esc(p)}</span><button class="copy">Copy</button></div>`;

  function guideBody(t) {
    return t.blocks.map(b => `<div class="guide-block">
        <h3 class="block">${b.h}</h3>
        <p>${b.text}</p>
        ${b.mock ? window.MOCK_APP : ""}
        ${b.img ? `<img src="${b.img}" alt="${esc(b.alt || "")}">` : ""}
      </div>`).join("");
  }

  function policyBody(t) {
    const ans = state.quizAnswers || {};
    return `
      <div class="chips"><span class="chip">${t.time}</span></div>
      <h3 class="block">The policy in six points</h3>
      <div class="tips">${t.points.map(([h, b]) => `<div class="tip"><b>${h}</b>${b}</div>`).join("")}</div>
      <div class="callout" style="margin-top:16px">${t.note}</div>

      <h3 class="block" id="quiz">Quiz <small>answer all ${t.quiz.length} correctly to continue</small></h3>
      ${state.policyPassed ? `<div class="quiz-pass">✓ You passed the quiz. The rest of the training is unlocked.</div>` : ""}
      <form id="quizForm">
      ${t.quiz.map((q, qi) => `<fieldset class="quiz-q" id="qq${qi}">
        <legend><span class="n">${qi + 1}</span>${esc(q.q)}</legend>
        ${q.options.map((o, oi) => `<label class="quiz-opt"><input type="radio" name="q${qi}" value="${oi}" ${String(ans[qi]) === String(oi) ? "checked" : ""}> ${esc(o)}</label>`).join("")}
        <p class="quiz-why" hidden></p>
      </fieldset>`).join("")}
      <div class="submit-row">
        <button class="submit" type="submit">Check my answers</button>
        <span class="status" id="quizStatus"></span>
      </div>
      </form>`;
  }

  function wireQuiz(t) {
    const form = document.getElementById("quizForm");
    if (!form) return;
    form.addEventListener("change", e => {
      state.quizAnswers = state.quizAnswers || {};
      state.quizAnswers[e.target.name.slice(1)] = e.target.value; save();
    });
    form.addEventListener("submit", e => {
      e.preventDefault();
      let right = 0, firstWrong = null;
      t.quiz.forEach((q, qi) => {
        const box = document.getElementById("qq" + qi), why = box.querySelector(".quiz-why");
        const pick = form.querySelector(`input[name="q${qi}"]:checked`);
        const ok = pick && +pick.value === q.answer;
        box.classList.toggle("right", !!ok); box.classList.toggle("wrong", !ok);
        why.hidden = false;
        why.textContent = !pick ? "Choose an answer." : ok ? "Correct. " + q.why : "Not quite. Read the policy point above and try again.";
        if (ok) right++; else if (firstWrong === null) firstWrong = box;
      });
      const status = document.getElementById("quizStatus");
      if (right === t.quiz.length) {
        state.policyPassed = true;
        if (!state.done.includes(t.id)) state.done.push(t.id);
        save(); renderNav();
        status.className = "status ok";
        status.innerHTML = "All correct. The rest of the training is unlocked.";
        const nb = document.querySelector('.nextbar button[data-go="' + (current + 1) + '"]');
        if (nb) nb.disabled = false;
      } else {
        status.className = "status err";
        status.textContent = `${right} of ${t.quiz.length} correct. Fix the ones marked in red and check again.`;
        firstWrong.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  }

  /* ---------- sharing page ---------- */
  const SHEET_URL = SITE.sheetUrl || "";
  const HOW = ["Saved me time", "Worked, with some fixing", "Mixed", "Didn't work for me"];
  function profile() {
    try { return JSON.parse(localStorage.getItem("nsciTrainings.profile")) || {}; } catch (e) { return {}; }
  }

  function shareBody() {
    const who = profile(), pre = state.sharePrefill;
    const ideas = all.filter(t => !t.guide && !t.policy && !t.share);
    return `
      <div class="chips"><span class="chip">about 5 minutes</span></div>
      <div class="callout"><b>Shared answers are public.</b> What you write here (but not your name) is shown on this page, grouped by department, to anyone who visits this site. To keep an answer private, check <b>Keep this private</b> below: it will only be seen by Paul Savala.</div>

      <h3 class="block">Tell us how it went</h3>
      <form id="shareForm" class="activity">
        <div class="share-who">
          <label>Your name<input name="name" value="${esc(who.name || "")}" autocomplete="name"></label>
          <label>Department<select name="dept"><option value="">Choose…</option>${(SITE.departments || []).map(d => `<option ${d === who.dept ? "selected" : ""}>${d}</option>`).join("")}</select></label>
        </div>
        <div class="q"><label>What did you try? <small>check any that apply</small></label>
          <div class="share-checks">${ideas.map(t => `<label><input type="checkbox" name="tasks" value="${esc(t.title)}" ${pre === t.id ? "checked" : ""}> ${t.title}</label>`).join("")}
            <label><input type="checkbox" name="tasks" value="Something else"> Something else</label></div></div>
        <div class="q"><label for="sh-what">What did you do?</label>
          <textarea id="sh-what" name="what" placeholder="For example: made a practice exam for Organic II from my old exams and lecture notes."></textarea></div>
        <div class="q"><label>How did it go?</label>
          <div class="share-checks">${HOW.map(h => `<label><input type="radio" name="how" value="${h}"> ${h}</label>`).join("")}</div></div>
        <div class="q"><label for="sh-notes">Details: what worked, what didn't?</label>
          <textarea id="sh-notes" name="notes"></textarea></div>
        <div class="q"><label for="sh-tip">A tip for colleagues <small>optional</small></label>
          <textarea id="sh-tip" name="tip" placeholder="A prompt that worked well, a mistake to avoid…"></textarea></div>
        <label class="share-private"><input type="checkbox" name="private"> <span><b>Keep this private.</b> Only Paul Savala will see it; it won't appear on this page.</span></label>
        <div class="submit-row">
          <button class="submit" type="submit">Share</button>
          <span class="status" id="shareStatus"></span>
        </div>
      </form>

      <h3 class="block">What colleagues tried <small>names are never shown</small></h3>
      <div id="shareList" class="share-list"><p class="others-note">Loading…</p></div>`;
  }

  function wireShare() {
    const form = document.getElementById("shareForm");
    if (!form) return;
    loadShares();
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const f = new FormData(form), status = document.getElementById("shareStatus"), btn = form.querySelector(".submit");
      const name = (f.get("name") || "").trim(), dept = f.get("dept") || "";
      const val = { tasks: f.getAll("tasks").join("; "), what: (f.get("what") || "").trim(), how: f.get("how") || "",
                    notes: (f.get("notes") || "").trim(), tip: (f.get("tip") || "").trim() };
      if (!name || !dept) { status.className = "status err"; status.textContent = "Please add your name and department."; return; }
      if (!val.what && !val.notes) { status.className = "status err"; status.textContent = "Please tell us a little about what you did."; return; }
      try { localStorage.setItem("nsciTrainings.profile", JSON.stringify({ name, dept })); } catch (err) { /* fine */ }
      const priv = !!f.get("private");
      if (!SHEET_URL) { status.className = "status err"; status.textContent = "Sharing isn't connected yet."; return; }
      btn.disabled = true; status.className = "status"; status.textContent = "Sending…";
      try {
        const res = await fetch(SHEET_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(Object.assign({ kind: "share", name, department: dept, private: priv }, val)) });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "not saved");
      } catch (err) {
        btn.disabled = false; status.className = "status err";
        status.textContent = "Couldn't send. Check your connection and try again; your answers are still here."; return;
      }
      if (!state.done.includes("share")) state.done.push("share");
      delete state.sharePrefill; save(); renderNav();
      form.reset(); form.elements.namedItem("name").value = name; form.elements.namedItem("dept").value = dept; btn.disabled = false;
      status.className = "status ok";
      status.textContent = priv ? "✓ Sent privately to Paul. Thank you!" : "✓ Shared. Thank you! It will appear below within a minute.";
      setTimeout(loadShares, 1500);
    });
  }

  async function loadShares() {
    const list = document.getElementById("shareList");
    if (!list) return;
    if (!SHEET_URL) { list.innerHTML = `<p class="others-note">Sharing isn't connected yet.</p>`; return; }
    let data;
    try { data = await (await fetch(`${SHEET_URL}?shares=1`)).json(); } catch (e) { data = { ok: false }; }
    if (!document.getElementById("shareList")) return;
    if (!data.ok) { list.innerHTML = `<p class="others-note">Couldn't load shared experiences right now. Try again in a minute.</p>`; return; }
    const people = data.shares || []; // newest first, public only
    if (!people.length) { list.innerHTML = `<p class="others-note">Nothing shared yet. Be the first!</p>`; return; }
    const byDept = {};
    people.forEach(p => (byDept[p.dept || "Department not given"] = byDept[p.dept || "Department not given"] || []).push(p));
    list.innerHTML = Object.keys(byDept).sort().map(d => `<details class="others-dept" open>
      <summary>${esc(d)} <span class="others-n">${byDept[d].length}</span></summary>
      ${byDept[d].map(a => { return `<div class="share-card">
        ${a.tasks ? `<div class="share-tags">${a.tasks.split("; ").map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}
        ${a.what ? `<p>${esc(a.what)}</p>` : ""}
        ${a.how ? `<p class="share-how">${esc(a.how)}</p>` : ""}
        ${a.notes ? `<p>${esc(a.notes)}</p>` : ""}
        ${a.tip ? `<p class="share-tip"><b>Tip:</b> ${esc(a.tip)}</p>` : ""}
      </div>`; }).join("")}
    </details>`).join("");
  }

  function taskBody(t) {
    return `
      <div class="chips">${(t.modes || []).map(m => CHIPS[m]).join("")}<span class="chip">${t.time}</span></div>

      ${t.before && t.before.length ? `<h3 class="block">Before you start</h3>
      <div class="callout"><ul class="plain">${t.before.map(b => `<li>${b}</li>`).join("")}</ul></div>` : ""}

      <h3 class="block">Step by step <small>copy each prompt into Claude</small></h3>
      ${t.steps.map((s, i) => `<div class="step">
        <h4><span class="n">${i + 1}</span>${s.title}</h4>
        <p>${s.why}</p>
        ${s.prompt ? promptBox(s.prompt) : ""}
        ${s.look ? `<p class="look"><b>What to check:</b> ${s.look}</p>` : ""}
      </div>`).join("")}

      <h3 class="block">Why these prompts work</h3>
      <div class="tips">${t.tips.map(([h, b]) => `<div class="tip"><b>${h}</b>${b}</div>`).join("")}</div>

      ${t.extras ? `<h3 class="block">Want to go further?</h3>
      ${t.extras.map(([h, p]) => `<details class="extra"><summary>${h}</summary>${promptBox(p)}</details>`).join("")}` : ""}`;
  }

  function renderMain() {
    const t = all[current], done = state.done.includes(t.id);
    document.getElementById("main").innerHTML = `
      <div class="eyebrow">${t.topic} · ${current + 1} of ${all.length}</div>
      <h2 class="title">${t.title}</h2>
      <p class="lede">${t.lede}</p>
      ${t.youtubeId ? `<h3 class="block" id="video">Watch it done <small>${t.videoMins || ""}</small></h3>
      <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(t.youtubeId)}?rel=0" title="${esc(t.title)} video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>` : ""}
      ${t.policy ? policyBody(t) : t.share ? shareBody() : t.guide ? guideBody(t) : taskBody(t)}
      ${!t.guide && !t.policy && !t.share ? `<div class="share-nudge">Tried this, something like it, or something else entirely? <a href="#share" data-share="${t.id}">Share how it went →</a></div>` : ""}
      ${t.policy || t.share ? "" : `<div class="submit-row">
        <button class="submit" id="doneBtn">${done ? "✓ Done (click to undo)" : "Mark as done"}</button>
      </div>`}
      <div class="nextbar">
        <button ${current === 0 ? "disabled" : ""} data-go="${current - 1}">← Previous</button>
        <button ${current === all.length - 1 || locked(current + 1) ? "disabled" : ""} data-go="${current + 1}">Next →</button>
      </div>`;

    wireMock();
    wireQuiz(t);
    wireShare();
    const nudge = document.querySelector("[data-share]");
    if (nudge) nudge.addEventListener("click", () => { state.sharePrefill = nudge.dataset.share; save(); });
    document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
      navigator.clipboard.writeText(b.previousElementSibling.textContent).then(() => {
        b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500);
      });
    }));
    const doneBtn = document.getElementById("doneBtn");
    if (doneBtn) doneBtn.addEventListener("click", () => {
      state.done = done ? state.done.filter(id => id !== t.id) : state.done.concat(t.id);
      save(); renderNav(); renderMain();
    });
  }

  // tooltips for the app mock: hover, keyboard focus, or tap
  function wireMock() {
    const tip = document.getElementById("mkTip");
    if (!tip) return;
    let active = null;
    const show = el => {
      if (active) active.classList.remove("mk-active");
      active = el; el.classList.add("mk-active");
      tip.textContent = el.dataset.tip;
      const r = el.getBoundingClientRect();
      tip.classList.add("show");
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let left = r.left + window.scrollX + r.width / 2 - w / 2;
      left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 8));
      let top = r.bottom + window.scrollY + 8;
      if (r.bottom + h + 16 > window.innerHeight) top = r.top + window.scrollY - h - 8;
      tip.style.left = left + "px"; tip.style.top = top + "px";
    };
    const hide = () => { tip.classList.remove("show"); if (active) active.classList.remove("mk-active"); active = null; };
    document.querySelectorAll("[data-tip]").forEach(el => {
      el.tabIndex = 0;
      el.addEventListener("mouseenter", () => show(el));
      el.addEventListener("mouseleave", hide);
      el.addEventListener("focus", () => show(el));
      el.addEventListener("blur", hide);
      el.addEventListener("click", e => { e.stopPropagation(); active === el ? hide() : show(el); });
    });
    document.addEventListener("click", hide);
  }

  function go(i) {
    if (locked(i)) i = GATE;
    current = i; save();
    history.replaceState(null, "", "#" + all[current].id);
    renderNav(); renderMain(); window.scrollTo(0, 0);
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (b && !b.disabled) go(+b.dataset.go);
  });
  window.addEventListener("hashchange", () => {
    const i = all.findIndex(t => t.id === location.hash.slice(1));
    if (i >= 0 && i !== current) go(i);
    else if (i >= 0 && locked(i)) go(GATE);
  });
  if (location.hash && current !== fromHash) history.replaceState(null, "", "#" + all[current].id);
  renderNav(); renderMain();
})();
</script>
</body>
</html>
