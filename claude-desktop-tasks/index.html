<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getting Things Done with Claude Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/workshop.css?v=3">
<style>
  /* task-page extras (move into workshop.css once settled) */
  .topic-label { padding: 18px 24px 6px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #64748B; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 28px; }
  .chip { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--card); color: var(--ink); }
  .chip.files { background: var(--blue-soft); }
  .chip.browser { background: #DCFCE7; color: #166534; }
  .chip.artifact { background: #FEF3C7; color: #92400E; }
  .callout { background: var(--amber-bg); color: var(--amber-ink); border-radius: 12px; padding: 16px 20px; font-size: 15px; line-height: 1.55; margin: 0 0 8px; }
  .callout b { color: var(--amber-ink); }
  ul.plain { margin: 0; padding-left: 20px; line-height: 1.7; font-size: 16px; }
  .step { background: white; border: 1px solid var(--rule); border-radius: 14px; padding: 22px 26px; margin: 0 0 16px; }
  .step h4 { margin: 0 0 6px; font-size: 18px; color: var(--ink); display: flex; gap: 12px; align-items: baseline; }
  .step h4 .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: white; display: grid; place-items: center; font-size: 14px; }
  .step p { margin: 0 0 4px; font-size: 15px; line-height: 1.55; }
  .prompt-wrap { position: relative; }
  .prompt-wrap .prompt { padding-right: 76px; }
  .copy { position: absolute; top: 8px; right: 8px; font: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--rule); background: white; color: var(--ink); cursor: pointer; }
  .copy:hover { border-color: var(--blue); color: var(--blue); }
  .look { font-size: 14px; color: var(--body); margin-top: 8px; }
  .look b { color: var(--ink); }
  .tips { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .tip { background: var(--card); border-radius: 12px; padding: 16px 18px; font-size: 15px; line-height: 1.5; }
  .tip b { display: block; color: var(--ink); margin-bottom: 4px; }
  details.extra { background: white; border: 1px solid var(--rule); border-radius: 12px; padding: 14px 20px; margin: 0 0 12px; }
  details.extra summary { cursor: pointer; font-weight: 500; color: var(--ink); }
  details.extra p { font-size: 15px; margin: 10px 0 0; }
  .guide-block { margin: 0 0 36px; }
  .guide-block p { font-size: 16px; line-height: 1.6; margin: 0 0 14px; max-width: 760px; }
  .guide-block img { display: block; max-width: 100%; max-height: 520px; border-radius: 12px; border: 1px solid var(--rule); box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12); }
  /* interactive app mock */
  .mk-hint { font-size: 15px; color: var(--body); margin: 0 0 12px; }
  .mk-scroll { overflow-x: auto; border-radius: 14px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18); }
  .mk-app { display: flex; min-width: 760px; height: 470px; background: #1a1a19; color: #e8e6e1; font-size: 14px; border-radius: 14px; overflow: hidden; }
  .mk-side { width: 210px; flex: none; background: #232322; border-right: 1px solid #333; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  .mk-top { display: flex; align-items: center; gap: 8px; padding: 0 6px 12px; }
  .mk-dots i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; background: #ff5f57; }
  .mk-dots i:nth-child(2) { background: #febc2e; } .mk-dots i:nth-child(3) { background: #28c840; }
  .mk-seg { display: flex; gap: 2px; margin-left: auto; }
  .mk-ico { padding: 3px 6px; border-radius: 6px; font-size: 13px; color: #c9c7c1; }
  .mk-ico.mk-on { background: #3a3a38; }
  .mk-dim { color: #777; }
  .mk-item { padding: 8px 10px; border-radius: 8px; color: #e8e6e1; display: flex; align-items: center; gap: 6px; }
  .mk-new { background: #3a3a38; }
  .mk-plus { margin-left: auto; color: #aaa; }
  .mk-group { padding: 18px 10px 0; color: #9a978f; font-size: 13px; line-height: 1.1; border-radius: 8px; }
  .mk-acct { margin-top: auto; padding: 10px; border-top: 1px solid #333; display: flex; align-items: center; gap: 8px; border-radius: 8px; }
  .mk-av { width: 22px; height: 22px; border-radius: 50%; background: #2e9e4f; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: white; }
  .mk-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px; gap: 12px; }
  .mk-hello { font-family: Georgia, serif; font-size: 30px; color: #f2f0eb; margin-bottom: 6px; }
  .mk-star { color: #d97757; }
  .mk-box { width: 100%; max-width: 520px; background: #2f2f2d; border: 1px solid #444; border-radius: 14px; padding: 12px 14px 8px; }
  .mk-input { color: #8f8c85; padding: 2px 4px 22px; border-radius: 6px; }
  .mk-row, .mk-ctrl { display: flex; align-items: center; gap: 6px; }
  .mk-ctrl { width: 100%; max-width: 520px; padding: 0 4px; }
  .mk-sp { flex: 1; }
  .mk-pill { padding: 4px 8px; border-radius: 8px; font-size: 13px; color: #e8e6e1; }
  .mk-pill.mk-dimtxt { color: #9a978f; }
  .mk-recent { width: 100%; max-width: 520px; margin-top: 18px; padding: 6px; border-radius: 10px; }
  .mk-rhead { display: flex; justify-content: space-between; color: #9a978f; font-size: 13px; margin-bottom: 8px; }
  .mk-cards { display: flex; gap: 10px; }
  .mk-cards div { flex: 1; border: 1px solid #3a3a38; border-radius: 10px; overflow: hidden; font-size: 12px; color: #d6d3cc; padding-bottom: 6px; }
  .mk-cards i { display: block; height: 46px; margin-bottom: 6px; background: linear-gradient(135deg, #1e3a6e, #0f172a); }
  .mk-cards div:nth-child(2) i { background: linear-gradient(135deg, #e5e7eb, #93c5fd); }
  .mk-cards div:nth-child(3) i { background: linear-gradient(135deg, #f1f5f9, #cbd5e1); }
  .mk-cards div { text-indent: 8px; }
  [data-tip] { cursor: help; transition: box-shadow 0.12s, background 0.12s; }
  [data-tip]:hover, [data-tip]:focus, [data-tip].mk-active { outline: none; box-shadow: 0 0 0 2px #3B82F6; background-color: rgba(59, 130, 246, 0.14); }
  .mk-tip { position: absolute; z-index: 20; max-width: 280px; padding: 10px 14px; border-radius: 10px; background: white; color: var(--ink); font-size: 14px; line-height: 1.45; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25); pointer-events: none; opacity: 0; transition: opacity 0.12s; }
  .mk-tip.show { opacity: 1; }
</style>
</head>
<body>
<script src="../shared/site-config.js?v=3"></script>
<script>
/* Interactive mock of the Claude desktop landing page (Getting started → The Claude app).
   Each element with data-tip shows that text on hover, focus or tap. */
window.MOCK_APP = `
<p class="mk-hint">Hover over (or tap) any part of the window to see what it does.</p>
<div class="mk-scroll"><div class="mk-app">
  <div class="mk-side">
    <div class="mk-top">
      <span class="mk-dots"><i></i><i></i><i></i></span>
      <span class="mk-ico" data-tip="Show or hide this sidebar.">▯</span>
      <span class="mk-ico mk-dim">‹ ›</span>
      <span class="mk-seg">
        <span class="mk-ico mk-on" data-tip="Chat: the regular Claude you'll use for everything on this site.">💬</span>
        <span class="mk-ico" data-tip="Code: Claude Code, a separate mode for programming projects. You won't need it here.">&lt;/&gt;</span>
      </span>
    </div>
    <div class="mk-item mk-new" data-tip="New: start a fresh task. Start a new one for each separate job, so Claude isn't distracted by an earlier conversation.">＋ New</div>
    <div class="mk-item" data-tip="Search: find a past conversation by keyword.">⌕ Search</div>
    <div class="mk-item" data-tip="Projects: a home for related work, such as one per course. Files and instructions you add to a project are available in every conversation inside it.">▤ Projects</div>
    <div class="mk-item" data-tip="Artifacts: everything Claude has built for you, such as web pages, interactive demos, slide decks and documents, kept in one place so you can reopen and share them.">❏ Artifacts <span class="mk-plus">＋</span></div>
    <div class="mk-item" data-tip="Scheduled: tasks you've asked Claude to run automatically, such as a weekly summary.">◷ Scheduled</div>
    <div class="mk-item" data-tip="Design: make visual designs such as posters, flyers and mockups.">◎ Design</div>
    <div class="mk-item" data-tip="Customize: add skills and connect other apps (such as Google Drive) so Claude can use them.">▣ Customize</div>
    <div class="mk-group" data-tip="Pinned and Recents: your past conversations. Pin the ones you come back to often.">Pinned ›<br><br>Recents ›</div>
    <div class="mk-acct" data-tip="Your account: your plan (which decides which models you can use) and settings."><span class="mk-av">P</span> Your name · Plan ⌄</div>
  </div>
  <div class="mk-main">
    <div class="mk-hello"><span class="mk-star">✳</span> Back at it</div>
    <div class="mk-box">
      <div class="mk-input" data-tip="Type what you want here, in plain language. The more specific you are about the result you want, the better.">How can I help you today?</div>
      <div class="mk-row">
        <span class="mk-ico" data-tip="Add files or images to this conversation, such as a syllabus or a screenshot.">＋</span>
        <span class="mk-sp"></span>
        <span class="mk-ico" data-tip="Dictate: speak instead of typing.">🎙</span>
        <span class="mk-ico" data-tip="Voice mode: have a spoken conversation with Claude.">〰</span>
      </div>
    </div>
    <div class="mk-ctrl">
      <span class="mk-pill" data-tip="Project or folder: choose a folder on your computer that Claude can read and change. See Connect a folder.">Project or folder ⌄</span>
      <span class="mk-sp"></span>
      <span class="mk-pill" data-tip="Model: which version of Claude does the work. Bigger models are more capable but slower. See Choose a model and effort.">Opus 5.5</span>
      <span class="mk-pill mk-dimtxt" data-tip="Effort: how long Claude thinks before answering. Raise it for hard problems. See Choose a model and effort.">Medium</span>
      <span class="mk-pill" data-tip="Permission mode: Manual asks before Claude uses a new tool or website; Auto lets it work on its own. See Permission mode.">Auto</span>
    </div>
    <div class="mk-recent" data-tip="Recent artifacts: the last few things Claude built for you. Click one to open it, or View all to see every one.">
      <div class="mk-rhead"><span>Recent artifacts</span><span>View all</span></div>
      <div class="mk-cards"><div><i></i>Course website</div><div><i></i>Predator–prey demo</div><div><i></i>Final review</div></div>
    </div>
  </div>
</div></div>
<div class="mk-tip" id="mkTip" role="tooltip"></div>`;
</script>
<script>
/* =====================================================================
   THIS TRAINING'S CONTENT. Topics hold tasks (step-by-step prompts) or
   guide pages (guide: true, with blocks of text and screenshots).
   Each task: topic, title, mode ("files", "browser", or both), time, lede,
   before (checklist), steps [{title, why, prompt, look}], tips, extras.
   ===================================================================== */
window.TASKS = {
  title: "Getting Things Done with Claude Desktop",
  subtitle: "NSCI Faculty Workshop",
  topics: [
    { name: "Getting started", tasks: [
      { id: "the-app", title: "The Claude app", guide: true, time: "2 min read",
        lede: "Claude Desktop looks like a chat window, but it can also work with files on your computer and use your web browser. Here's what you'll see when you open it.",
        blocks: [
          { h: "The main window", mock: true,
            text: "This is what you see when you open Claude Desktop. Most of the time you only need three things: <b>New</b> to start a task, the <b>message box</b> to say what you want, and the <b>controls under the box</b>." },
          { h: "The three controls under the box", img: "img/compose-box.png", alt: "The message box with Project or folder, model, effort and permission controls",
            text: "Before you start a task, glance at these. <b>Project or folder</b> chooses which folder Claude can work in. <b>Opus 5.5 Medium</b> is the model and how hard it thinks. <b>Auto</b> (or Manual) controls how often Claude stops to ask your permission. Each one has its own page in this section." }
        ] },
      { id: "model-effort", title: "Choose a model and effort", guide: true, time: "2 min read",
        lede: "Which model you use, and how hard you let it think, makes a big difference to the results. Defaults are fine for quick questions; turn things up for anything hard.",
        blocks: [
          { h: "The model menu", img: "img/model-menu.png", alt: "The model menu listing Fable, Opus, Sonnet and Haiku, with an Effort setting",
            text: "Click the model name under the message box. Bigger models are more capable but slower: <b>Fable</b> is for the toughest problems, <b>Opus</b> is a strong everyday choice, and <b>Sonnet</b> and <b>Haiku</b> are faster for simple jobs. <b>Effort</b> sets how long Claude thinks before answering." },
          { h: "A simple rule", text: "Start with Opus at Medium effort. If a result is shallow or wrong on something hard (a tricky problem, a careful critique, a long analysis), raise the effort or switch to a bigger model and try again before giving up. As we saw in the workshop, the same model can go from failing to excelling on a hard benchmark just by thinking longer." }
        ] },
      { id: "connect-folder", title: "Connect a folder", guide: true, time: "2 min read",
        lede: "Claude can only see the folders you give it. Connecting one lets it read, organize and create files there.",
        blocks: [
          { h: "1. Add the folder", img: "img/add-folder.png", alt: "The Project or folder menu with Add folder highlighted",
            text: "Click <b>Project or folder</b> under the message box, then <b>Add folder</b>, and pick the folder. Tip: make a copy of the folder first and connect the copy." },
          { h: "2. Allow access", img: "img/folder-access.png", alt: "A dialog asking to allow Claude to access a folder",
            text: "Your computer asks you to confirm. Click <b>Allow</b>. Leave \"Don't ask again\" unchecked while you're learning." },
          { h: "3. Approve changes", img: "img/change-files.png", alt: "A prompt asking to allow Claude to change files in a folder",
            text: "The first time Claude wants to change files, it asks. <b>Allow</b> approves it for this task; <b>Always allow</b> approves it from now on. Choose Allow until you're comfortable." },
          { h: "Keep it safe", text: "Only connect folders with your own materials. Never connect a folder with student work, grades, rosters or other sensitive university information." }
        ] },
      { id: "permissions", title: "Permission mode", guide: true, time: "1 min read",
        lede: "This setting decides how often Claude stops to check with you.",
        blocks: [
          { h: "Manual or Auto", img: "img/permission-mode.png", alt: "The permission mode menu with Manual and Auto options",
            text: "Click <b>Manual</b> or <b>Auto</b> under the message box. <b>Manual</b> asks before Claude uses a new tool or opens a new website. <b>Auto</b> lets it work on its own and pause only when something looks unsafe. Use Manual while you're learning: the prompts show you what Claude is doing, and you can say no to anything." }
        ] },
      { id: "browser", title: "Let Claude use your browser", guide: true, time: "2 min read",
        lede: "With the Claude extension for Chrome, Claude can open web pages, read them, and fill in forms for you.",
        blocks: [
          { h: "1. Install and pin the extension", img: "img/chrome-extension.png", alt: "Chrome's extensions menu with the Claude extension and a pin button",
            text: "Install the <b>Claude</b> extension from the Chrome Web Store and sign in with the same account you use for Claude Desktop. Then open Chrome's extensions menu (the puzzle piece) and click the pin next to Claude so it stays in your toolbar." },
          { h: "2. Claude in Chrome", img: "img/chrome-panel.png", alt: "Claude open in a side panel in Chrome",
            text: "Clicking the Claude icon opens a side panel where you can ask Claude to do things on the page in front of you. Claude Desktop can also use Chrome when a task needs the web; in Manual mode it asks before opening each new site." },
          { h: "Keep it safe", text: "Claude works in your real browser, where you're signed in. Before a browser task, close tabs you don't want it to see, especially email and the LMS, and only approve the sites the task needs." }
        ] }
    ] },
    { name: "Teaching", tasks: [
      { id: "review-sheet", title: "Final exam review sheet",
        modes: ["files"], time: "about 20 minutes",
        lede: "Turn your own lecture notes and slides into a study guide for the final: the key ideas, a formula or concept sheet, and practice problems with an answer key.",
        before: [
          "Put <b>copies of your notes, slides and past problem sets</b> for the course in a folder and connect it.",
          "<b>Leave out anything with student information</b>, such as graded work or gradebook exports.",
          "Know roughly what the final covers (which weeks or chapters)."
        ],
        steps: [
          { title: "Map what the course covered",
            why: "Checking the topic list first makes sure the review sheet matches what you actually taught.",
            prompt: "Read the course materials in this folder. List the main topics we covered, in order, with the key ideas, definitions and formulas for each. The final covers [weeks or chapters]. Don't write the review sheet yet.",
            look: "Cross out anything that won't be on the final, and add anything it missed." },
          { title: "Draft the review sheet",
            why: "Telling it the length and who it's for keeps it from turning into a second textbook.",
            prompt: "Write a review sheet for my students: one section per topic with the key ideas in plain language, then a one-page formula and concept sheet at the end. Keep it to about [4] pages. Use the same notation and terms as my notes. Save it as a Word document called Final Review.",
            look: "Check that the notation matches yours. Students notice when it doesn't." },
          { title: "Add practice problems",
            why: "Asking it to solve and check each problem catches errors before your students do.",
            prompt: "Add 2–3 practice problems for each topic, similar in style and difficulty to the problems in my materials. Work out each solution step by step, check each answer, and put the solutions in a separate answer key file.",
            look: "Work two or three problems yourself and compare with the key." }
        ],
        tips: [
          ["Use your own materials", "Pointing Claude at your notes keeps the review sheet in your notation and at your level, not a generic textbook's."],
          ["Separate the key", "A separate answer key lets you post the review sheet first and the solutions later."],
          ["Match your style", "\"Similar to the problems in my materials\" gets problems that look like yours."]
        ],
        extras: [
          ["A version for a review session", "Turn the review sheet into 10 slides for an in-class review session, with one practice problem per slide and the solution on the following slide."]
        ] },

      { id: "alt-exam", title: "Alternate exam versions",
        modes: ["files"], time: "about 20 minutes",
        lede: "Make a makeup or alternate version of your own exam: same skills, same difficulty, new numbers or scenarios, with a checked answer key.",
        before: [
          "Put <b>a copy of the exam</b> (and its key, if you have one) in a folder and connect it.",
          "<b>No student work.</b> Just the blank exam and your key."
        ],
        steps: [
          { title: "Break down what each question tests",
            why: "An alternate version is only fair if each question tests the same skill at the same level.",
            prompt: "Read the exam in this folder. For each question, tell me what skill or concept it tests and what makes it easy or hard (the steps involved, any traps). Don't write anything new yet.",
            look: "Correct anything it got wrong. This list is what the new version has to match." },
          { title: "Write the new version",
            why: "Saying what to change, and what to keep, gets a true parallel version instead of a different exam.",
            prompt: "Write an alternate version of this exam. Each question should test the same skill at the same difficulty, but with different numbers, compounds, organisms or scenarios, so a student who saw the original can't simply reuse answers. Keep the same format, point values and order. Save it as a Word document called Exam - Version B.",
            look: "Read a few questions side by side with the originals. Same skill? Same difficulty?" },
          { title: "Write and check the key",
            why: "For anything with a numerical answer, having Claude check its work with code catches arithmetic slips.",
            prompt: "Write a complete answer key for Version B with worked solutions. For every question with a numerical answer, check the answer by running a calculation in code, and tell me about any answer that didn't match on the first try. Save it as Exam - Version B Key.",
            look: "Spot-check a few answers yourself, especially any it flagged." }
        ],
        tips: [
          ["Skills first", "Listing what each question tests is what keeps the two versions equally hard."],
          ["Ask it to check with code", "Claude can make arithmetic mistakes when writing; running the numbers catches them."],
          ["Say what stays the same", "Format, point values and order all matter for fairness, so name them."]
        ],
        extras: [
          ["Scramble the order", "Make a third version with the same questions as Version B, but with the question order and multiple-choice options shuffled, plus a matching key."]
        ] },

      { id: "demo", title: "Interactive concept demo",
        modes: ["artifact"], time: "about 20 minutes",
        lede: "Have Claude build an interactive web page for a concept you teach, such as predator–prey dynamics with sliders for birth and death rates, that students can play with to build intuition.",
        before: [
          "<b>Pick one concept</b> where seeing it change would help: a model with parameters, a process over time, a curve that depends on conditions.",
          "Think about <b>what students should notice</b> when they play with it. That's the most important part of the prompt."
        ],
        steps: [
          { title: "Describe the concept and the goal",
            why: "Saying what students should learn, not just what to draw, gets a demo that teaches rather than just moves.",
            prompt: "Build an interactive web page for my [course] students about [concept, e.g. Lotka–Volterra predator–prey dynamics]. Students should be able to change [the parameters, e.g. prey birth rate, predation rate, predator death rate] with sliders and immediately see [what changes, e.g. the population graphs over time]. The goal is for them to notice [what you want them to see, e.g. that the populations cycle, and how the cycles change]. Keep it simple and readable on a phone.",
            look: "Play with it. Does it behave the way the real system does at the extremes?" },
          { title: "Check the science",
            why: "A demo that looks right but uses the wrong equation is worse than none, so make Claude show its work.",
            prompt: "Explain the equations or rules your demo uses and the default parameter values. Are there any simplifications a student should know about?",
            look: "Compare with how you teach it. Ask it to change anything that doesn't match your notation or model." },
          { title: "Make it teach",
            why: "A few guided questions turn a toy into an activity.",
            prompt: "Add a short 'Try this' box with 3 questions that lead students to discover [the key idea], each answered by changing a slider. Don't give the answers on the page.",
            look: "" },
          { title: "Share it",
            why: "Claude can publish the page as an artifact with its own link.",
            prompt: "Publish this as an artifact I can share with my students.",
            look: "Open the link in a private browser window to check that students will be able to see it, then add the link to your LMS or course website." }
        ],
        tips: [
          ["Say what students should notice", "That one sentence shapes the whole design."],
          ["Verify the model", "Ask for the equations and defaults. It's your name on the demo."],
          ["Iterate in plain language", "\"Make the sliders bigger\", \"add a phase plot\", \"use our textbook's symbols\" all work."]
        ],
        extras: [
          ["Ideas for other fields", "Suggest 5 concepts from [course] that would make good interactive demos, and say what students would learn from each."]
        ] },

      { id: "quiz", title: "Quiz from your notes",
        modes: ["files", "browser"], time: "about 25 minutes",
        lede: "Have Claude write quiz questions from your own notes, then enter them into your LMS for you, in a practice course with no students in it.",
        before: [
          "Put <b>copies of the notes or slides</b> the quiz covers in a folder and connect it.",
          "<b>Use a sandbox or empty course shell in the LMS</b>, never a live course with students. A live course shows rosters and grades.",
          "<b>Close tabs you don't want Claude to see</b>, such as email."
        ],
        steps: [
          { title: "Write the questions",
            why: "Reviewing the questions before anything goes into the LMS is much easier than fixing them there.",
            prompt: "Read my notes in this folder on [topic]. Write a [10]-question quiz: [mix of multiple choice and short answer]. Questions should test understanding, not just recall of terms. For multiple choice, make each wrong option a mistake a student might really make. Save it as a document called Quiz Draft with the answers marked.",
            look: "Edit any question you don't like, in the file or by telling Claude." },
          { title: "Enter it in the LMS",

      { id: "lit-review", title: "Literature review",

          { title: "Find the patterns",

            prompt: "Using only the Literature Table, write a two-page summary: what's well established, where studies disagree, and what seems to be missing. Cite papers by author and year, and don't cite anything that isn't in the table.",

          { title: "Follow the references",

        tips: [

          ["Fence it in", "\"Don't cite anything that isn't in the table\" keeps the writing tied to sources you can check."],
          ["Be specific about scope", "Years, organisms, methods and \"peer-reviewed\" narrow the search to papers you'd actually use."],
          ["Paywalls", "Claude can only read what your browser can. If you're signed in through the library, it can usually see more."]
        ],
        extras: [
          ["Start from PDFs you already have", "Read every PDF in this folder and add each one to the Literature Table with the same columns. Mark these rows as 'from my folder'."]

      { id: "data-analysis", title: "Data analysis and report",
        modes: ["files"], time: "about 30 minutes",
        lede: "Hand Claude a spreadsheet of your own data and get graphs, trends and a short written report, with the analysis shown so you can check it.",
        before: [

        tips: [

</script>
<script>
(function () {
  const SITE = window.SITE_CONFIG || {};
  const T = window.TASKS;
  const STORE_KEY = "nsciTrainings.claude-desktop-tasks";
  const all = [];
  T.topics.forEach(tp => tp.tasks.forEach(t => all.push(Object.assign({ topic: tp.name }, t))));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* saved state (this browser only), same pattern as the other trainings */
  let state = {};
  try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { /* storage unavailable */ }
  state.done = state.done || [];
  const fromHash = all.findIndex(t => t.id === location.hash.slice(1));
  let current = fromHash >= 0 ? fromHash : Math.min(state.current || 0, all.length - 1);
  function save() {
    state.current = current;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* fine */ }
  }

  document.title = T.title;
  document.body.classList.add("training");
  document.body.innerHTML = `
    <aside class="sidebar">
      <div class="brand">
        <a class="home" href="../">← All trainings</a>
        <div class="bar"></div>
        <h1>${T.title}</h1>
        <p>${T.subtitle || ""}${SITE.presenter ? ` · ${SITE.presenter}` : ""}</p>
      </div>
      <nav id="nav"></nav>
    </aside>
    <main id="main"></main>`;

  function renderNav() {
    let html = "", i = 0;
    T.topics.forEach(tp => {
      html += `<div class="topic-label">${tp.name}</div>`;
      tp.tasks.forEach(t => {
        const idx = i++, done = state.done.includes(t.id);
        html += `<button class="sec-btn ${idx === current ? "active" : ""} ${done ? "done" : ""}" data-go="${idx}">
          <span class="num">${done ? "✓" : idx + 1}</span>
          <span>${t.title}<span class="meta">${t.time || ""}</span></span></button>`;
      });
    });
    document.getElementById("nav").innerHTML = html;
  }

  const CHIPS = { browser: `<span class="chip browser">Browser</span>`, files: `<span class="chip files">Your files</span>`, artifact: `<span class="chip artifact">Artifact</span>` };
  const promptBox = p => `<div class="prompt-wrap"><span class="prompt">${esc(p)}</span><button class="copy">Copy</button></div>`;

  function guideBody(t) {
    return t.blocks.map(b => `<div class="guide-block">
        <h3 class="block">${b.h}</h3>
        <p>${b.text}</p>
        ${b.mock ? window.MOCK_APP : ""}
        ${b.img ? `<img src="${b.img}" alt="${esc(b.alt || "")}">` : ""}
      </div>`).join("");
  }

  function taskBody(t) {
    return `
      <div class="chips">${(t.modes || []).map(m => CHIPS[m]).join("")}<span class="chip">${t.time}</span></div>

      <h3 class="block">Before you start</h3>
      <div class="callout"><ul class="plain">${t.before.map(b => `<li>${b}</li>`).join("")}</ul></div>

      <h3 class="block">Step by step <small>copy each prompt into Claude</small></h3>
      ${t.steps.map((s, i) => `<div class="step">
        <h4><span class="n">${i + 1}</span>${s.title}</h4>
        <p>${s.why}</p>
        ${promptBox(s.prompt)}
        ${s.look ? `<p class="look"><b>What to check:</b> ${s.look}</p>` : ""}
      </div>`).join("")}

      <h3 class="block">Why these prompts work</h3>
      <div class="tips">${t.tips.map(([h, b]) => `<div class="tip"><b>${h}</b>${b}</div>`).join("")}</div>

      ${t.extras ? `<h3 class="block">Want to go further?</h3>
      ${t.extras.map(([h, p]) => `<details class="extra"><summary>${h}</summary>${promptBox(p)}</details>`).join("")}` : ""}`;
  }

  function renderMain() {
    const t = all[current], done = state.done.includes(t.id);
    document.getElementById("main").innerHTML = `
      <div class="eyebrow">${t.topic} · ${current + 1} of ${all.length}</div>
      <h2 class="title">${t.title}</h2>
      <p class="lede">${t.lede}</p>
      ${t.guide ? guideBody(t) : taskBody(t)}
      <div class="submit-row">
        <button class="submit" id="doneBtn">${done ? "✓ Done (click to undo)" : "Mark as done"}</button>
      </div>
      <div class="nextbar">
        <button ${current === 0 ? "disabled" : ""} data-go="${current - 1}">← Previous</button>
        <button ${current === all.length - 1 ? "disabled" : ""} data-go="${current + 1}">Next →</button>
      </div>`;

    wireMock();
    document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
      navigator.clipboard.writeText(b.previousElementSibling.textContent).then(() => {
        b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500);
      });
    }));
    document.getElementById("doneBtn").addEventListener("click", () => {
      state.done = done ? state.done.filter(id => id !== t.id) : state.done.concat(t.id);
      save(); renderNav(); renderMain();
    });
  }

  // tooltips for the app mock: hover, keyboard focus, or tap
  function wireMock() {
    const tip = document.getElementById("mkTip");
    if (!tip) return;
    let active = null;
    const show = el => {
      if (active) active.classList.remove("mk-active");
      active = el; el.classList.add("mk-active");
      tip.textContent = el.dataset.tip;
      const r = el.getBoundingClientRect();
      tip.classList.add("show");
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let left = r.left + window.scrollX + r.width / 2 - w / 2;
      left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 8));
      let top = r.bottom + window.scrollY + 8;
      if (r.bottom + h + 16 > window.innerHeight) top = r.top + window.scrollY - h - 8;
      tip.style.left = left + "px"; tip.style.top = top + "px";
    };
    const hide = () => { tip.classList.remove("show"); if (active) active.classList.remove("mk-active"); active = null; };
    document.querySelectorAll("[data-tip]").forEach(el => {
      el.tabIndex = 0;
      el.addEventListener("mouseenter", () => show(el));
      el.addEventListener("mouseleave", hide);
      el.addEventListener("focus", () => show(el));
      el.addEventListener("blur", hide);
      el.addEventListener("click", e => { e.stopPropagation(); active === el ? hide() : show(el); });
    });
    document.addEventListener("click", hide);
  }

  function go(i) {
    current = i; save();
    history.replaceState(null, "", "#" + all[current].id);
    renderNav(); renderMain(); window.scrollTo(0, 0);
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (b && !b.disabled) go(+b.dataset.go);
  });
  window.addEventListener("hashchange", () => {
    const i = all.findIndex(t => t.id === location.hash.slice(1));
    if (i >= 0 && i !== current) go(i);
  });
  renderNav(); renderMain();
})();
</script>
</body>
</html>
